name: prototype-apk

on:
  push:
    branches:
      - prototype/release-0.01
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache: 'false'

      - name: Build installable prototype APK (debug-signed)
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and write SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p prototype-output
          cp "$APK" prototype-output/shinon-agent-0.01-prototype.apk
          sha256sum prototype-output/shinon-agent-0.01-prototype.apk | tee prototype-output/SHA256SUMS.txt
          printf 'versionName=0.01\nbuildType=debug\nsigning=Android debug keystore\nruntime=not bundled\n' > prototype-output/BUILD-INFO.txt
          unzip -l "$APK" | tail -n 5

      - name: Upload prototype APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: shinon-agent-0.01-prototype
          path: prototype-output/*
          if-no-files-found: error
          retention-days: 30

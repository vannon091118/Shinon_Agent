# Shinon Forge — Android-Shell · CI: Build + Release-Signing + APK-Upload
#
# Gate: android-build (MOBILE-PLAN.md §5 W4) — blockierend ab W4.
# Secrets (Settings → Secrets and variables → Actions, NIE im Repo):
#   SHINON_KEYSTORE_B64    Base64-String der .jks-Datei
#   SHINON_KEYSTORE_ALIAS  Alias-Name (z. B. shinon)
#   SHINON_KEYSTORE_PASS   Keystore-Passwort
#   SHINON_KEY_ALIAS_PASS  Alias-Passwort
# Fail-closed: fehlt SHINON_KEYSTORE_B64, bricht der Build ABE — kein
# ungesigntes APK wird je hochgeladen.

name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v0.0.1) — leer = nur Build, kein Release"
        required: false
        default: ""

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Root-Cause (Lauf 39105891911): alle 6 CI-Läufe rot.
      # Der Compiler meldete "Unresolved reference: InputType" — NUR,
      # weil github/ubuntu-latest kein Android-SDK vorinstalliert hat
      # und der Gradle-Build damit ohne android.jar (Plattform-34)
      # lief. Alle android.*-Klassen (Context, InputType, Base64,
      # MODE_PRIVATE) waren dem Kotlin-Compiler unbekannt.
      #
      # Fix: command-line-tools → platforms;android-34 + build-tools
      # → local.properties (sdk.dir=...) vor dem ersten Gradle-Daemon-Start.
      - name: Install Android SDK (plattform-34 + build-tools)
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # 1) command-line-tools herunterladen
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline
          # 2) SDK-Struktur aufbauen
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdline/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          # 3) Plattform-34 + Build-Tools installieren (Yes-to-All)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "platform-tools" 2>/dev/null
          # 4) local.properties (der AGP-Pfad, VOR dem Gradle-Start)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SDK-Prüfung: $(ls $ANDROID_HOME/platforms/)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Decode Keystore from Secrets (temporär, NIE als Artifact)
        env:
          SHINON_KEYSTORE_B64: ${{ secrets.SHINON_KEYSTORE_B64 }}
        run: |
          if [ -z "${SHINON_KEYSTORE_B64}" ]; then
            echo "::error::SHINON_KEYSTORE_B64 fehlt — fail-closed, kein ungesigntes APK"
            exit 1
          fi
          mkdir -p keystore
          echo "${SHINON_KEYSTORE_B64}" | base64 -d > keystore/release.jks
          # In die Runner-Umgebung (keine Secret-Leaks in Logs)
          echo "SHINON_KEYSTORE_PATH=$(pwd)/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Configure Signing
        env:
          SHINON_KEYSTORE_PASS: ${{ secrets.SHINON_KEYSTORE_PASS }}
          SHINON_KEYSTORE_ALIAS: ${{ secrets.SHINON_KEYSTORE_ALIAS }}
          SHINON_KEY_ALIAS_PASS: ${{ secrets.SHINON_KEY_ALIAS_PASS }}
        run: |
          # Die build.gradle.kts liest die Signatur aus Environment.
          # Existenzcheck (fail-closed): alle vier müssen gesetzt sein.
          if [ -z "${SHINON_KEYSTORE_PASS}" ] || [ -z "${SHINON_KEYSTORE_ALIAS}" ]; then
            echo "::error::Signing-Secrets unvollständig (PASS/ALIAS fehlen)"
            exit 1
          fi

      - name: "Fail-closed: Runtime-Release für den Forge-Pin existieren"
        run: |
          # Der aktuelle Forge-Pin steht in SetupActivity.kt (SHINON_FORGE_PIN).
          # Vor dem Build: die Existenz des Forge-Release runtime-<pin> prüfen.
          # Fehlt es → der Build bricht hier, nicht erst im Device.
          set -euo pipefail
          PIN="$(grep 'SHINON_FORGE_PIN' app/src/main/java/com/vannon/shinon/SetupActivity.kt \
                | grep -oE '[0-9a-f]{7,40}' | head -1)"
          if [ -z "$PIN" ]; then
            echo "::error::SHINON_FORGE_PIN in SetupActivity.kt nicht lesbar — fail-closed"
            exit 1
          fi
          echo "Forge-Pin: $PIN"
          SHORT="${PIN:0:7}"
          URL="https://api.github.com/repos/vannon091118/shinon-forge/releases/tags/runtime-${SHORT}"
          HTTP="$(curl -sL -H 'Accept: application/vnd.github+json' -o /dev/null -w '%{http_code}' "$URL")"
          if [ "$HTTP" = "404" ]; then
            echo "::error::Forge-Release runtime-${SHORT} existiert noch nicht (fail-closed)."
            echo "Push zuerst nach shinon-forge main (der CI-Flow baut das Release)."
            exit 1
          fi
          echo "Forge-Release runtime-${SHORT}: vorhanden (HTTP $HTTP)"

      - name: Build Release APK
        run: gradle assembleRelease

      - name: "APK-Content-Gate (Entkopplung: keine Forge-Daten, kein DSH-Vendor)"
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "Prüfe Entkopplung: $APK"
          # Die APK darf NIE shinon-forge-Daten (Engine, Profil, Bundles)
          # oder den DSH-Vendor (node_modules, dsh) enthalten — die
          # gehören zum Runtime-Paket (filesDir/runtime/, SetupActivity).
          # Ein einziger Fund macht den Build ROT (fail-closed).
          if unzip -l "$APK" | grep -Ei 'node_modules|shinon-forge|/dsh|profile[s]?/mobile'; then
            echo "::error::APK enthält Forge-Daten oder DSH-Vendor — Entkopplungsvertrag verletzt (MOBILE-PLAN.md W4)"
            exit 1
          fi
          echo "APK-Content-Gate: PASS (keine Forge-Daten, kein DSH-Vendor)"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shinon-agent-v0.0.1.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release (only when tag is set)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="RELEASE_NOTES.md"
          # Die Release-Notes liegen im Repo (versioniert, mit Humor);
          # der CI nimmt sie 1:1 — kein generischer Auto-Müll.
          gh release create "${{ inputs.tag }}" \
            app/build/outputs/apk/release/*.apk \
            --title "Shinon Agent ${{ inputs.tag }}" \
            --notes-file "$NOTES_FILE"
          # Das signierte APK hängt am Release — Download für den
          # ersten Live-Test ohne Runner-Dependence.

      - name: Clean up Keystore (nie im Runner-Artefakt übrig)
        if: always()
        run: |
          rm -f keystore/release.jks

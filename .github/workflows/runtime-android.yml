name: Shinon Android Runtime

on:
  push:
    branches: [runtime/proot-bootstrap-0.02]
  pull_request:
    branches: [main]
  workflow_dispatch:

# New branch heads supersede old rootfs / emulator builds; don't spend CI minutes
# proving an APK that no longer matches the current source.
concurrency:
  group: shinon-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORGE_REPOSITORY: vannon091118/shinon-forge
  FORGE_COMMIT: 34163aacd7870bdc9a1efbb4b1e26edf8ffabccc
  RUNTIME_NODE_VERSION: v22.19.0
  ANDROID_NDK_VERSION: 26.3.11579264

jobs:
  package-runtime:
    name: Build pinned ARM64 rootfs and Forge runtime
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install rootfs packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap rsync xz-utils
      - name: Build Debian Bookworm ARM64 rootfs
        run: |
          sudo bash ./rootfs/build-rootfs.sh "$RUNNER_TEMP/rootfs-out"
          test -s "$RUNNER_TEMP/rootfs-out/debian.tar.xz"
          test -s "$RUNNER_TEMP/rootfs-out/debian.tar.xz.sha256"
          EXPECTED="$(cat "$RUNNER_TEMP/rootfs-out/debian.tar.xz.sha256")"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/rootfs-out/debian.tar.xz" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
      - uses: actions/checkout@v4
        with:
          repository: vannon091118/shinon-forge
          ref: 34163aacd7870bdc9a1efbb4b1e26edf8ffabccc
          path: forge-source
          persist-credentials: false
      - name: Install and test Forge inside the target Debian glibc rootfs
        shell: bash
        run: |
          set -euo pipefail
          GUEST="$RUNNER_TEMP/debian-guest"
          mkdir -p "$GUEST"
          sudo tar xJf "$RUNNER_TEMP/rootfs-out/debian.tar.xz" -C "$GUEST" --no-same-owner --touch
          # The distributable rootfs intentionally leaves /dev empty for PRoot.
          # During privileged CI chroot tests, bind host devices and proc/sys explicitly.
          sudo mount --bind /dev "$GUEST/dev"
          sudo mount --bind /proc "$GUEST/proc"
          sudo mount --bind /sys "$GUEST/sys"
          trap 'sudo umount "$GUEST/sys" 2>/dev/null || true; sudo umount "$GUEST/proc" 2>/dev/null || true; sudo umount "$GUEST/dev" 2>/dev/null || true' EXIT
          # Give the temporary build chroot working DNS. The shipped rootfs tar remains unchanged.
          sudo rm -f "$GUEST/etc/resolv.conf"
          sudo install -m 0644 /etc/resolv.conf "$GUEST/etc/resolv.conf"
          # Native dependencies must be installed/compiled against Debian bookworm's glibc,
          # not Ubuntu's newer glibc, or they can fail only after installation on Android.
          sudo chroot "$GUEST" /usr/bin/env -i HOME=/root PATH=/usr/bin:/bin /bin/sh -c             'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential python3 pkg-config ca-certificates'
          sudo mkdir -p "$GUEST/root/shinon"
          sudo rsync -a --delete --exclude=.git --exclude=node_modules "$GITHUB_WORKSPACE/forge-source/" "$GUEST/root/shinon/"
          sudo chroot "$GUEST" /usr/bin/env -i HOME=/root PATH=/root/shinon/node_modules/.bin:/usr/bin:/bin DSH_HOME=/root/shinon             /usr/bin/node /usr/lib/node_modules/npm/bin/npm-cli.js ci --prefix /root/shinon --no-audit --no-fund
          sudo chroot "$GUEST" /usr/bin/env -i HOME=/root PATH=/root/shinon/node_modules/.bin:/usr/bin:/bin DSH_HOME=/root/shinon             /usr/bin/node /root/shinon/scripts/mobile-profile-contract-test.mjs
          sudo chroot "$GUEST" /usr/bin/env -i HOME=/root PATH=/root/shinon/node_modules/.bin:/usr/bin:/bin DSH_HOME=/root/shinon             /usr/bin/node /root/shinon/scripts/shinon-profile-test.mjs --profile mobile
          sudo chroot "$GUEST" /usr/bin/env -i HOME=/root PATH=/usr/bin:/bin /usr/bin/node --version | grep -Fx "$RUNTIME_NODE_VERSION"
          # Boot the exact mobile profile in the target glibc rootfs and verify the tokenized HTTP endpoint.
          sudo chroot "$GUEST" /usr/bin/env -i HOME=/root PATH=/root/shinon/node_modules/.bin:/usr/bin:/bin DSH_HOME=/root/shinon /usr/bin/node --expose-internals /root/shinon/node_modules/@deepseek-ai/dsh/lib/bin.js --profile mobile --no-open --trusted-host localhost --trusted-host 127.0.0.1 --port 3089 > "$RUNNER_TEMP/mobile-engine.log" 2>&1 &
          ENGINE_PID=$!
          trap 'sudo pkill -f "[n]ode /root/shinon/node_modules/@deepseek-ai/dsh/lib/bin.js" || true; kill "$ENGINE_PID" 2>/dev/null || true' EXIT
          READY_LINE=""
          for attempt in $(seq 1 90); do
            READY_LINE="$(grep -Eo 'dsh web: http://[^[:space:]]+' "$RUNNER_TEMP/mobile-engine.log" | tail -n 1 || true)"
            if [ -n "$READY_LINE" ]; then break; fi
            sleep 2
          done
          test -n "$READY_LINE" || { echo "Mobile profile never emitted READY"; tail -80 "$RUNNER_TEMP/mobile-engine.log"; exit 1; }
          READY_URL="${READY_LINE#dsh web: }"
          python3 -c 'import sys; from urllib.parse import urlparse, parse_qs; u=urlparse(sys.argv[1]); assert u.scheme == "http" and u.hostname in ("127.0.0.1", "localhost") and 0 < u.port < 65536 and parse_qs(u.query).get("token", [""])[0], "READY URL failed loopback/token contract"; print("CHROOT_READY_URL_CONTRACT=PASS host=" + u.hostname)' "$READY_URL"
          HTTP_CODE="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "$READY_URL")"
          test "$HTTP_CODE" -ge 200 && test "$HTTP_CODE" -lt 300 || { echo "READY URL returned HTTP $HTTP_CODE"; tail -80 "$RUNNER_TEMP/mobile-engine.log"; exit 1; }
          echo "CHROOT_READY_HTTP=PASS status=$HTTP_CODE (token redacted)"
          sudo pkill -f '[n]ode /root/shinon/node_modules/@deepseek-ai/dsh/lib/bin.js' || true
          kill "$ENGINE_PID" 2>/dev/null || true
          trap - EXIT
          mkdir -p "$RUNNER_TEMP/mobile-runtime-out"
          sudo tar czf "$RUNNER_TEMP/mobile-runtime-out/shinon-forge-mobile-runtime.tar.gz"             --exclude=.git --exclude='node_modules/.cache' -C "$GUEST/root/shinon" .
          sudo chown "$USER":"$USER" "$RUNNER_TEMP/mobile-runtime-out/shinon-forge-mobile-runtime.tar.gz"
          (cd "$RUNNER_TEMP/mobile-runtime-out" && sha256sum shinon-forge-mobile-runtime.tar.gz > shinon-forge-mobile-runtime.tar.gz.sha256)
          cp "$RUNNER_TEMP/rootfs-out/debian.tar.xz"* "$RUNNER_TEMP/mobile-runtime-out/"
          ls -lh "$RUNNER_TEMP/mobile-runtime-out/"
      - uses: actions/upload-artifact@v4
        with:
          name: shinon-mobile-runtime-assets
          path: ${{ runner.temp }}/mobile-runtime-out/*
          if-no-files-found: error
          retention-days: 7

  android-build:
    name: Native Android build and APK checks
    needs: package-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;26.3.11579264'
      - name: Install Rust Android target and cargo-ndk
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.99.0
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Rust host tests
        run: cd rust && cargo test --workspace --locked
      - name: Build proot for Android ARM64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          bash ./tools/build-proot.sh aarch64-linux-android
          test -s app/src/main/assets/proot/proot-aarch64
          mv app/src/main/assets/proot/proot-aarch64 app/src/main/assets/proot/proot-arm64
          chmod 755 app/src/main/assets/proot/proot-arm64
          sha256sum app/src/main/assets/proot/proot-arm64 | awk '{print $1}' > app/src/main/assets/proot/proot-arm64.sha256
      - name: Build JNI native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          cd rust
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: shinon-mobile-runtime-assets
          path: runtime-assets
      - name: Embed verified rootfs assets
        run: |
          mkdir -p app/src/main/assets/rootfs
          cp runtime-assets/debian.tar.xz app/src/main/assets/rootfs/
          cp runtime-assets/debian.tar.xz.sha256 app/src/main/assets/rootfs/
          echo "Rootfs SHA256: $(cat app/src/main/assets/rootfs/debian.tar.xz.sha256)"
          sha256sum app/src/main/assets/rootfs/debian.tar.xz
      - name: Build Android APK
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/runtime/proot-bootstrap-0.02" ]; then
            RELEASE_TAG="mobile-runtime-${GITHUB_SHA:0:12}"
          else
            RELEASE_TAG="mobile-runtime-${GITHUB_SHA:0:12}"
          fi
          RUNTIME_SHA256="$(sha256sum runtime-assets/shinon-forge-mobile-runtime.tar.gz | awk '{print $1}')"
          echo "Using runtime release tag $RELEASE_TAG"
          echo "Pinned runtime SHA-256: $RUNTIME_SHA256"
          ./gradlew --no-daemon :app:assembleDebug -PshinonRuntimeRelease="$RELEASE_TAG" -PshinonRuntimeSha256="$RUNTIME_SHA256"
      - name: Verify APK, assets and native symbols
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep 'lib/arm64-v8a/libdshmobile_jni.so'
          unzip -l "$APK" | grep 'assets/rootfs/debian.tar.xz'
          unzip -l "$APK" | grep 'assets/proot/proot-arm64'
          unzip -p "$APK" assets/proot/proot-arm64 > "$RUNNER_TEMP/proot-from-apk"
          unzip -p "$APK" assets/proot/proot-arm64.sha256 > "$RUNNER_TEMP/proot-from-apk.sha256"
          test "$(sha256sum "$RUNNER_TEMP/proot-from-apk" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/proot-from-apk.sha256")"
          $ANDROID_SDK_ROOT/build-tools/34.0.0/aapt dump badging "$APK" | head -3
          if unzip -v "$APK" | grep -E 'assets/.*\.(xz|gz)$' | grep -q Defl; then
            echo 'xz/gz runtime assets were deflated despite noCompress'
            exit 1
          fi
          sha256sum "$APK" > app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: shinon-agent-0.02-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: shinon-runtime-release-assets
          path: runtime-assets/shinon-forge-mobile-runtime.tar.gz*
          if-no-files-found: error
          retention-days: 7

  publish-runtime:
    name: Publish pinned runtime and matching prototype APK
    needs: android-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/runtime/proot-bootstrap-0.02'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shinon-runtime-release-assets
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: shinon-agent-0.02-debug-apk
          path: dist
      - name: Verify published runtime asset hash
        run: |
          cd dist
          sha256sum -c shinon-forge-mobile-runtime.tar.gz.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-runtime-${GITHUB_SHA:0:12}"
          gh release create "$TAG" \
            dist/shinon-forge-mobile-runtime.tar.gz \
            dist/shinon-forge-mobile-runtime.tar.gz.sha256 \
            dist/app-debug.apk \
            dist/app-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Shinon Agent 0.02 runtime ${GITHUB_SHA:0:12}" \
            --notes "Reproducible ARM64 runtime assets are hash-pinned. Gate A requires an actual Android install and tokenized loopback HTTP READY; CI build success alone is not device proof."

  android-emulator-smoke:
    name: Android API 35 ARM64-translation READY handshake
    needs: publish-runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/runtime/proot-bootstrap-0.02'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shinon-agent-0.02-debug-apk
          path: dist
      - name: Install the published APK and prove Gate A on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb wait-for-device
            for boot in $(seq 1 60); do
              [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
              sleep 2
            done
            adb install -r dist/app-debug.apk
            adb logcat -c
            adb shell am start -n com.vannon.shinon/.SetupActivity
            for attempt in $(seq 1 360); do
              LOGS="$(adb logcat -d -s ShinonService:I SetupActivity:E AndroidRuntime:E)"
              if printf '%s' "$LOGS" | grep -Fq 'READY verified: loopback HTTP responded'; then
                echo 'ANDROID_GATE_A=PASS; fresh app install reached a tokenized loopback URL and a successful HTTP probe'
                exit 0
              fi
              if printf '%s' "$LOGS" | grep -Eqi 'Runtime setup failed|Native runtime did not start|READY not verified before timeout|FATAL EXCEPTION'; then
                printf '%s\n' "$LOGS" | grep -Ei 'Runtime setup failed|Native runtime did not start|READY not verified before timeout|FATAL EXCEPTION|Caused by:' | tail -50
                adb shell run-as com.vannon.shinon cat files/logs/dsh.log 2>/dev/null | sed -E 's/([?&]token=)[^&[:space:]]+/\1[REDACTED]/g' | tail -80 || true
                exit 1
              fi
              sleep 2
            done
            echo 'ANDROID_GATE_A=FAIL; no verified READY within 12 minutes'
            adb logcat -d -s ShinonService:I SetupActivity:E AndroidRuntime:E | tail -100
            adb shell run-as com.vannon.shinon cat files/logs/dsh.log 2>/dev/null | sed -E 's/([?&]token=)[^&[:space:]]+/\1[REDACTED]/g' | tail -80 || true
            exit 1

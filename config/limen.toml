[server]
port = 8000
host = "127.0.0.1"

[database]
# Project-relative OUTSIDE the limen-main submodule so a future
# `git submodule update` does not destroy your data.
path = "data/limen/limen.db"

[audit]
enabled = true

[routing]
default_provider_chain = ["groq", "openrouter", "nvidia", "github"]
auto_model = true

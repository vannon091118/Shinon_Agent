<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#12122a"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- Circuit grid lines -->
  <g stroke="#1e1e3a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#2a2a4a" stroke="#6366f1" stroke-width="0.5" opacity="0.3">
    <circle cx="100" cy="80" r="3"/><circle cx="300" cy="40" r="3"/>
    <circle cx="500" cy="80" r="3"/><circle cx="700" cy="40" r="3"/>
    <circle cx="200" cy="280" r="3"/><circle cx="600" cy="280" r="3"/>
    <circle cx="400" cy="240" r="3"/><circle cx="800" cy="240" r="3"/>
  </g>

  <!-- Main title -->
  <text x="450" y="100" text-anchor="middle" font-family="monospace" font-size="48" font-weight="bold" fill="url(#accent)" filter="url(#glow)">
    弑 の ん
  </text>

  <!-- Subtitle -->
  <text x="450" y="140" text-anchor="middle" font-family="monospace" font-size="22" fill="#a78bfa" filter="url(#softGlow)" letter-spacing="8">
    S H I N O N
  </text>

  <!-- Tagline -->
  <text x="450" y="170" text-anchor="middle" font-family="monospace" font-size="13" fill="#6b7280" letter-spacing="2">
    CONTROL PLANE — LLM OPERATING SYSTEM LAYER
  </text>

  <!-- Divider line -->
  <line x1="200" y1="190" x2="700" y2="190" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>

  <!-- Component row -->
  <g font-family="monospace" font-size="10" text-anchor="middle">
    <text x="130" y="215" fill="#6366f1">SHINON</text>
    <text x="130" y="228" fill="#4b5563">Character</text>

    <text x="260" y="215" fill="#a78bfa">PROMTGUARD</text>
    <text x="260" y="228" fill="#4b5563">Claims</text>

    <text x="390" y="215" fill="#f59e0b">KARMA</text>
    <text x="390" y="228" fill="#4b5563">Falsification</text>

    <text x="530" y="215" fill="#10b981">GOAL-CHAIN</text>
    <text x="530" y="228" fill="#4b5563">Orchestration</text>

    <text x="670" y="215" fill="#ef4444">LIMEN</text>
    <text x="670" y="228" fill="#4b5563">Dispatch</text>
  </g>

  <!-- Component connecting lines -->
  <g stroke="#4b5563" stroke-width="0.5" opacity="0.3">
    <line x1="165" y1="222" x2="225" y2="222"/>
    <line x1="295" y1="222" x2="355" y2="222"/>
    <line x1="425" y1="222" x2="495" y2="222"/>
    <line x1="565" y1="222" x2="635" y2="222"/>
  </g>

  <!-- Footer: origin line -->
  <text x="450" y="260" text-anchor="middle" font-family="monospace" font-size="9" fill="#374151" letter-spacing="3">
    LIFEGAMELAB → LLM_MIDDLEWARE → SyxBridge → Shinon → Promtguard → KARMA → goal&#x2011;chain → LIMEN
  </text>

  <!-- Footer: version -->
  <text x="450" y="295" text-anchor="middle" font-family="monospace" font-size="9" fill="#1f2937" letter-spacing="2">
    CONTROL PLANE MVP · 2026 · DETERMINISTIC · FALSIFICATION-GATED · APPEND-ONLY
  </text>
</svg>

# Shinon Forge — Android-Shell (W4)
#
# EINE Sache: eine Android-App startet die Shinon-Engine (shinon-forge),
# DSH lädt das Mobile-Profil, der lokale Server liefert die Weboberfläche.
#
# Kein Capacitor, kein React Native, kein Framework-Overhead.
#
# Gradle-Properties (notwendig für AndroidX-Dependencies).
# AndroidX ist verpflichtend seit AGP 4.0; ohne diese Properties
# bricht der Build mit "Default package not found" (CI-Run 38509246399).
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# android.defaults.buildfeatures.buildconfig ist entfernt: der Code verwendet
# BuildConfig nirgends, und AGP 8 meldet das Property als deprecated.
android.nonTransitiveRClass=true
